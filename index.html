<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F7F4">
<title>KasiQuote</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17251C;background:#F5F7F4;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
header{max-width:560px;margin:auto;padding:20px 0 12px;font-size:1.35rem;font-weight:750}
main{max-width:560px;margin:auto}
h1{font-size:1.25rem;margin:8px 0 16px}
h2{font-size:1.05rem;margin:0 0 12px}
.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 1px 5px #17251c0c}
label{display:block;font-weight:600;margin:12px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #cbd4cd;border-radius:9px;background:#fff;color:#17251C}
textarea{min-height:110px;resize:vertical}
small,.hint{color:#58675d}
button{font:inherit;font-weight:650;font-size:16px;border:0;border-radius:10px;padding:13px 16px;min-height:48px;cursor:pointer}
.primary{background:#176B45;color:#fff;width:100%;margin-top:16px}
.secondary{background:#E5F3EA;color:#176B45}
.breakdown p,.summary p{display:flex;justify-content:space-between;gap:12px;margin:10px 0}
.pale{background:#E5F3EA}
.big{font-size:1.8rem;font-weight:800;margin:0 0 12px}
.job-title{font-size:1.1rem;font-weight:700}
.status{color:#58675d;margin:5px 0 12px}
.error{color:#A12626}
nav{position:fixed;z-index:2;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e1e7e2;display:flex;justify-content:center;gap:8px}
nav button{flex:1;max-width:180px;background:transparent;color:#58675d}
nav button.active{background:#E5F3EA;color:#176B45;font-weight:750}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.filters button{background:#fff;color:#17251C;border:1px solid #d5ded7}
.filters button.active{background:#176B45;color:#fff;border-color:#176B45}
.chart-row{margin:14px 0}
.chart-label{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;margin-bottom:6px}
.track{height:14px;background:#e8ede9;border-radius:20px;overflow:hidden}
.bar{height:100%;background:#176B45;border-radius:20px}
.notice{max-width:560px;margin:0 auto 8px;font-weight:600}
.notice:empty{display:none}
@media(min-width:600px){body{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<header>KasiQuote</header>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<main id="app"></main>
<nav aria-label="Main navigation">
  <button data-tab="Quote" class="active">Quote</button>
  <button data-tab="Jobs">Jobs</button>
  <button data-tab="Earnings">Earnings</button>
</nav>
<script>
(() => {
  const KEY = "kasiquote-data";
  const app = document.querySelector("#app"), notice = document.querySelector("#notice");
  const blank = () => ({jobs:[], income:[]});
  let data = blank(), tab = "Quote", period = "This month", quoteResult = null;
  let quoteDraft = {name:"",hours:"",rate:"",materials:"",transport:""}, payOpen = null, addOpen = false;
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.jobs) && Array.isArray(saved.income)) data = saved;
  } catch {}
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const money = n => "R" + (n / 100).toFixed(2);
  const localISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const today = () => localISO(new Date());
  const asCents = v => { if (String(v).trim()==="") return null; const n=Number(v); return Number.isFinite(n) ? Math.round(n*100) : null; };
  const costsCents = v => String(v).trim()==="" ? 0 : asCents(v);
  const validDate = s => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y,m,d]=s.split("-").map(Number), x=new Date(y,m-1,d);
    return x.getFullYear()===y && x.getMonth()===m-1 && x.getDate()===d;
  };
  function say(text, error=false) {
    notice.textContent=text; notice.className="notice"+(error?" error":"");
    if(text) setTimeout(()=>{if(notice.textContent===text) notice.textContent="";},4500);
  }
  function commit(next, done) {
    try { localStorage.setItem(KEY, JSON.stringify(next)); data=next; done(); }
    catch { say("Couldn’t save. Try again.", true); }
  }
  function field(label,id,value,type="text",attrs="") {
    return `<label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${attrs}>`;
  }
  function renderQuote() {
    if (quoteResult) {
      const j=quoteResult, msg=`Hi! My quote for ${j.name} is ${money(j.quoted)}. Please let me know if you’d like to go ahead.`;
      return `<h1>Quote</h1><section class="card pale"><h2>Suggested quote</h2><p class="big">${money(j.quoted)}</p><p>${esc(j.name)}</p></section>
        <section class="card"><label for="quote-message">WhatsApp message</label><textarea id="quote-message" readonly>${esc(msg)}</textarea>
        <button class="primary" data-action="copy">Copy WhatsApp message</button><button class="secondary" data-action="new-quote" style="width:100%;margin-top:10px">New quote</button></section>`;
    }
    const d=quoteDraft, h=Number(d.hours), rate=asCents(d.rate), mat=costsCents(d.materials), trans=costsCents(d.transport);
    const valid=h>0 && Number.isFinite(h) && rate>0 && mat!==null && mat>=0 && trans!==null && trans>=0;
    const labour=valid?Math.round(h*rate):0, costs=valid?mat+trans:0, total=labour+costs;
    return `<h1>Quote</h1><form id="quote-form" class="card">
      ${field("Job name","q-name",d.name)}
      ${field("Estimated hours","q-hours",d.hours,"number",'min="0.01" step="any" inputmode="decimal"')}
      ${field("Hourly rate (R)","q-rate",d.rate,"number",'min="0.01" step="0.01" inputmode="decimal"')}
      <small>What you want to earn per hour</small>
      ${field("Materials (R)","q-materials",d.materials,"number",'min="0" step="0.01" inputmode="decimal"')}
      ${field("Transport (R)","q-transport",d.transport,"number",'min="0" step="0.01" inputmode="decimal"')}
      <div class="card breakdown"><p><span>Labour</span><strong>${money(labour)}</strong></p><p><span>Job costs</span><strong>${money(costs)}</strong></p><p><span>Suggested quote</span><strong>${money(total)}</strong></p></div>
      <button class="primary">Generate quote</button></form>`;
  }
  function renderJobs() {
    if (!data.jobs.length) return `<h1>Jobs</h1><section class="card">No quotes yet</section>`;
    const jobs=[...data.jobs].sort((a,b)=>b.created-a.created);
    return `<h1>Jobs</h1>${jobs.map(j=>{
      let action="";
      if(j.status==="Awaiting acceptance") action='<button class="primary" data-action="accept">Mark accepted</button>';
      else if(j.status==="Accepted") action='<button class="primary" data-action="complete">Mark completed</button>';
      else if(j.status==="Completed · Awaiting payment") action=`<button class="primary" data-action="pay-open">Record payment</button>${payOpen===j.id?paymentForm(j):""}`;
      else if(j.payment) action=`<p><strong>Paid ${money(j.payment.amount)}</strong><br><span class="hint">${esc(j.payment.date)}</span></p>`;
      return `<section class="card" data-job="${esc(j.id)}"><div class="job-title">${esc(j.name)}</div><p>Quoted: <strong>${money(j.quoted)}</strong></p><div class="status">${esc(j.status)}</div>${action}</section>`;
    }).join("")}`;
  }
  function paymentForm(j) {
    return `<form class="payment-form"><h2>Record payment</h2>${field("Amount received","pay-amount",((j.quoted/100).toFixed(2)),"number",'min="0.01" step="0.01" inputmode="decimal"')}
      ${field("Payment date","pay-date",today(),"date")}<button class="primary">Save payment</button></form>`;
  }
  function range() {
    const now=new Date(), y=now.getFullYear(), m=now.getMonth();
    if(period==="This month") return [localISO(new Date(y,m,1)),localISO(new Date(y,m+1,0))];
    if(period==="Last month") return [localISO(new Date(y,m-1,1)),localISO(new Date(y,m,0))];
    const monday=new Date(y,m,now.getDate()); monday.setDate(monday.getDate()-((now.getDay()+6)%7)-7);
    const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
    return [localISO(monday),localISO(sunday)];
  }
  function renderEarnings() {
    const [start,end]=range();
    const payments=[
      ...data.jobs.filter(j=>j.payment).map(j=>({date:j.payment.date,amount:j.payment.amount,cost:j.materials+j.transport})),
      ...data.income.map(i=>({date:i.date,amount:i.amount,cost:i.costs}))
    ].filter(x=>x.date>=start&&x.date<=end);
    const received=payments.reduce((s,x)=>s+x.amount,0), costs=payments.reduce((s,x)=>s+x.cost,0);
    let groups=[];
    if(period==="Last week") {
      const d=new Date(start+"T12:00:00");
      for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);const date=localISO(x);groups.push({label:x.toLocaleDateString(undefined,{weekday:"short",month:"numeric",day:"numeric"}),start:date,end:date,total:0});}
    } else {
      const first=new Date(start+"T12:00:00"), days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
      for(let a=1;a<=days;a+=7){const b=Math.min(a+6,days),from=localISO(new Date(first.getFullYear(),first.getMonth(),a)),to=localISO(new Date(first.getFullYear(),first.getMonth(),b));groups.push({label:`${a}–${b}`,start:from,end:to,total:0});}
    }
    payments.forEach(p=>{const g=groups.find(g=>p.date>=g.start&&p.date<=g.end);if(g)g.total+=p.amount;});
    const max=Math.max(0,...groups.map(g=>g.total));
    const chart=payments.length?groups.map(g=>`<div class="chart-row"><div class="chart-label"><span>${g.label}</span><strong>${money(g.total)}</strong></div><div class="track"><div class="bar" style="width:${max?g.total/max*100:0}%"></div></div></div>`).join(""):'<p class="hint">No payments recorded for this period</p>';
    return `<h1>Earnings</h1><div class="filters">${["This month","Last month","Last week"].map(x=>`<button data-period="${x}" class="${period===x?"active":""}">${x}</button>`).join("")}</div>
      <section class="card pale summary"><h2>Take-home</h2><p class="big">${money(received-costs)}</p><p><span>Payments received</span><strong>${money(received)}</strong></p><p><span>Job costs</span><strong>${money(costs)}</strong></p></section>
      <section class="card"><h2>Payments received</h2>${chart}</section>
      <button class="primary" data-action="income-open">Add income</button>
      ${addOpen?`<form id="income-form" class="card"><h2>Add income</h2>${field("Amount received","income-amount","","number",'min="0.01" step="0.01" inputmode="decimal"')}
      ${field("Payment date","income-date",today(),"date")}${field("Job costs (R)","income-costs","0","number",'min="0" step="0.01" inputmode="decimal')}
      <button class="primary">Save income</button></form>`:""}`;
  }
  function render() {
    document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
    app.innerHTML=tab==="Quote"?renderQuote():tab==="Jobs"?renderJobs():renderEarnings();
  }
  document.querySelector("nav").addEventListener("click",e=>{
    const b=e.target.closest("[data-tab]"); if(b){tab=b.dataset.tab;render();}
  });
  app.addEventListener("input",e=>{
    const ids={"q-name":"name","q-hours":"hours","q-rate":"rate","q-materials":"materials","q-transport":"transport"};
    if(ids[e.target.id]){quoteDraft[ids[e.target.id]]=e.target.value;render();}
  });
  app.addEventListener("click",async e=>{
    const b=e.target.closest("[data-action],[data-period]"); if(!b)return;
    if(b.dataset.period){period=b.dataset.period;render();return;}
    const card=b.closest("[data-job]"), id=card?.dataset.job, j=data.jobs.find(x=>x.id===id);
    if(b.dataset.action==="new-quote"){quoteResult=null;quoteDraft={name:"",hours:"",rate:"",materials:"",transport:""};say("");render();}
    if(b.dataset.action==="copy"){
      const box=app.querySelector("#quote-message");
      try {if(!navigator.clipboard) throw 0; await navigator.clipboard.writeText(box.value);say("Copied");}
      catch {box.focus();box.select();say("Select and copy the message");}
    }
    if(b.dataset.action==="income-open"){addOpen=!addOpen;render();}
    if(b.dataset.action==="pay-open"){payOpen=id;render();}
    if(j&&["accept","complete"].includes(b.dataset.action)){
      const next=JSON.parse(JSON.stringify(data)), target=next.jobs.find(x=>x.id===id);
      target.status=b.dataset.action==="accept"?"Accepted":"Completed · Awaiting payment";
      commit(next,()=>{render();say("Saved");});
    }
  });
  app.addEventListener("submit",e=>{
    e.preventDefault();
    if(e.target.id==="quote-form"){
      const d=quoteDraft, hours=Number(d.hours), rate=asCents(d.rate), materials=costsCents(d.materials), transport=costsCents(d.transport);
      if(!d.name.trim()||!Number.isFinite(hours)||hours<=0||rate===null||rate<=0||materials===null||materials<0||transport===null||transport<0){say("Check the job name, hours, rate, and costs.",true);return;}
      const labour=Math.round(hours*rate), quoted=labour+materials+transport;
      const job={id:crypto.randomUUID?.()||String(Date.now()),created:Date.now(),name:d.name.trim(),labour,materials,transport,quoted,status:"Awaiting acceptance",payment:null};
      const next=JSON.parse(JSON.stringify(data));next.jobs.push(job);
      commit(next,()=>{quoteResult=job;say("");render();});
    }
    if(e.target.classList.contains("payment-form")){
      const card=e.target.closest("[data-job]"), id=card.dataset.job, amount=asCents(e.target.elements["pay-amount"].value), date=e.target.elements["pay-date"].value;
      if(amount===null||amount<=0||!validDate(date)){say("Enter a positive amount and valid payment date.",true);return;}
      const next=JSON.parse(JSON.stringify(data)), j=next.jobs.find(x=>x.id===id);
      if(!j||j.payment)return;
      j.payment={amount,date};j.status="Paid";
      commit(next,()=>{payOpen=null;render();say(`Payment saved: ${money(amount)} on ${date}.`);});
    }
    if(e.target.id==="income-form"){
      const amount=asCents(e.target.elements["income-amount"].value), date=e.target.elements["income-date"].value, costs=costsCents(e.target.elements["income-costs"].value);
      if(amount===null||amount<=0||!validDate(date)||costs===null||costs<0){say("Enter a positive amount, valid date, and non-negative costs.",true);return;}
      const next=JSON.parse(JSON.stringify(data));next.income.push({id:crypto.randomUUID?.()||String(Date.now()),amount,date,costs});
      commit(next,()=>{addOpen=false;render();say(`Income saved: ${money(amount)} on ${date}.`);});
    }
  });
  render();
  if("serviceWorker" in navigator && location.protocol==="https:"){
    navigator.serviceWorker.register("./sw.js").then(async()=>{
      const reg=await navigator.serviceWorker.ready, worker=reg.active;
      if(!worker)return;
      const channel=new MessageChannel();
      channel.port1.onmessage=e=>{if(e.data==="cached")say("Ready to use offline");};
      worker.postMessage("CHECK_CACHE",[channel.port2]);
    }).catch(()=>{});
  }
})();
</script>
</body>
</html>
